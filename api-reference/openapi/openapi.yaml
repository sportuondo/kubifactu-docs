        - issue_date
        - operation_description
        - tax_breakdown
        - total_quota
        - total_amount

    CreateBatchOfInvoiceRecordsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - response
          properties:
            response:
              type: string
              description: Confirmación de que el lote se ha registrado para su procesamiento diferido.
              example: "Batch of invoice records processed for deferred submission to Veri*Factu."

    CreateInvoiceRecordResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: |
                Identificador (ID) de la factura en el sistema de **KubiFACTU**. Se utiliza para hacer referencia al registro de facturación desde otros endpoints como, por ejemplo, el de anulación de facturas.
            record_type:
              $ref: "#/components/schemas/record_type"
            request_id:
              type: string
              description: Identificador de la petición como referencia para el soporte técnico.
              example: "2cc8ef846029ec69613711ad1d85f6dfebf16ffb"
            sif_id:
              type: string
              description: ID del SIF utilizado para la creación del registro.
              format: uuid
              example: "0995C42C-6708-44FB-BFBF-B363A5FE873E"
            fiscal_year:
              type: integer
              description: Año fiscal de la factura.
            full_invoice_number:
              type: string
              description: Número de la factura registrada.
            issue_date:
              type: string
              format: date
              example: "2026-09-15"
              description: Fecha de expedición del registro de facturación.
            created_at:
              type: string
              format: date-time
              example: "2026-09-15T07:35:24.992854Z"
              description: Fecha y hora de creación de la factura en nuestro sistema.
            fingerprint:
              nullable: true
              type: string
              description: Huella SHA-256 del registro de facturación registrado.
            csv:
              nullable: true
              type: string
              description: |
                Código Seguro de Verificación (CSV) que la AEAT emite en la respuesta a la remisión. Acredita la remisión, no cada registro individual.

                **Un `csv` vacío (`null`) no significa que el registro no esté acreditado.** La AEAT no devuelve el CSV en consultas posteriores, por lo que un registro aceptado puede no tenerlo; por ejemplo, cuando el resultado del envío no llegó (timeout o respuesta ilegible) y se confirmó después con una consulta de estado. Para saber si un registro está acreditado, usa `vf_record_registration_status`, no la presencia del `csv`.

                En los envíos diferidos por lote, todos los registros del mismo envío comparten el mismo CSV, también los rechazados. Solo se omite si la AEAT rechaza todos los registros del envío.

                Un reenvío no borra un CSV ya guardado cuando la nueva respuesta no incluye uno. Un CSV nuevo sustituye al anterior. [Leer más en la FAQ](/faq).
            vf_post_status:
              $ref: "#/components/schemas/vf_post_status"
            vf_record_registration_status:
              $ref: "#/components/schemas/vf_record_registration_status"
            has_warnings:
              type: boolean
              description: Indica si el registro contiene errores que deban ser subsanados.
              example: false
            vf_error_descriptions:
              nullable: true
              type: string
              description: Cadena con la descripción de los errores devueltos por Veri*Factu.
            next_request_waiting_time:
              type: integer
              description: Tiempo que se debe esperar en segundos para que la empresa cliente pueda enviar una nueva petición.
            next_request_datetime:
              type: string
              format: date-time
              example: "1977-04-22T06:00:00Z"
              description: Fecha y hora en la que la empresa cliente pueda enviar una nueva petición en formato ISO-8601 (ej.- 1977-04-22T06:00:00Z) con zona horaria UTC.
            qr_value:
              type: string
              nullable: true
              format: uri
              description: URL que debe mostrarse en el QR de las facturas procesadas con Veri*Factu. Esta URL sirve para que el receptor de la factura pueda validar que esta ha sido correctamente enviada a Veri*Factu. Este campo será `null` cuando Veri*Factu rechace el registro de facturación.
            qr_image_url:
              type: string
              nullable: true
              format: uri
              description: URL para descargar la imagen PNG del QR generado por KubiFACTU mediante el endpoint [Descargar imagen QR del registro de facturación](/openapi-reference/descargar-imagen-qr-del-registro-de-facturación). La petición debe incluir el header `X-Qbikode-ClientApiKey`. Este campo será `null` cuando Veri*Factu rechace el registro de facturación o no aplique mostrar QR.
            xml_url:
              type: string
              nullable: true
              format: uri
              description: URL para descargar el XML del registro de facturación enviado a Veri*Factu mediante el endpoint [Descargar XML del registro de facturación](/openapi-reference/descargar-xml-del-registro-de-facturación). La petición debe incluir el header `X-Qbikode-ClientApiKey`. Este campo será `null` cuando el XML aún no esté disponible, por ejemplo en registros de facturación en diferido pendientes de procesar.
            vf_response_body:
              type: string
              nullable: true
              format: byte
              description: Cuerpo de la respuesta de Veri*Factu en formato Base64. Contiene el XML completo devuelto por la AEAT tras el envío del registro de facturación. Este campo será `null` para facturas en diferido que aún no han sido procesadas o cuando no se haya recibido respuesta de Veri*Factu.

    CancelInvoiceRecordResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: |
                Identificador (ID) de la factura en el sistema de **KubiFACTU**. Se utiliza para hacer referencia al registro de facturación desde otros endpoints como, por ejemplo, el de anulación de facturas.
            request_id:
              type: string
              description: Identificador de la petición como referencia para el soporte técnico.
              example: "2cc8ef846029ec69613711ad1d85f6dfebf16ffb"
            sif_id:
              type: string
              description: ID del SIF utilizado para la creación del registro.
              format: uuid
              example: "0995C42C-6708-44FB-BFBF-B363A5FE873E"
            fingerprint:
              nullable: true
              type: string
              description: Huella SHA-256 de la factura registrada.
            vf_post_status:
              $ref: "#/components/schemas/vf_post_status"
            vf_record_registration_status:
              $ref: "#/components/schemas/vf_record_registration_status"
            has_warnings:
              type: boolean
              description: Indica si el registro contiene errores que deban ser subsanados.
              example: false
            vf_error_descriptions:
              nullable: true
              type: string
              description: Cadena con la descripción de los errores devueltos por Veri*Factu.
            next_request_waiting_time:
              type: integer
              description: Tiempo que se debe esperar en segundos para que la empresa cliente pueda enviar una nueva petición.
            next_request_datetime:
              type: string
              format: date-time
              example: "1977-04-22T06:00:00Z"
              description: Fecha y hora en la que la empresa cliente pueda enviar una nueva petición en formato ISO-8601 (ej.- 1977-04-22T06:00:00Z) con zona horaria UTC.

    InvoiceLite:
      type: object
      required:
        - total_quota
        - total_amount
        - tax_breakdown
      properties:
        id:
          type: string
          format: uuid
          description: Identificador (ID) de la factura en el sistema de KubiFACTU.
        client_invoice_id:
          type: string
          nullable: true
          description: Identificador único de la factura dentro del sistema del cliente.
        record_type:
          $ref: "#/components/schemas/record_type"
        request_id:
          type: string
          description: Identificador de la petición como referencia para el soporte técnico.
          example: "2cc8ef846029ec69613711ad1d85f6dfebf16ffb"
        fiscal_year:
          type: integer
          description: Año fiscal de la factura.
          example: 2026
        full_invoice_number:
          type: string
          description: Número de la factura registrada.
          example: "F2026-0000123"
        issue_date:
          type: string
          format: date
          example: "2026-09-15"
          description: Fecha de expedición del registro de facturación.
        created_at:
          type: string
          format: date-time
          example: "2026-09-15T07:35:24.992854Z"
          description: Fecha y hora de creación de la factura en nuestro sistema.
        total_quota:
          type: number
          format: decimal
          description: Cuota total almacenada de la factura, incluida la cuota de recargo de equivalencia. Se devuelve como número JSON. En los registros de anulación es `0`.
          example: 21.11
        total_amount:
          type: number
          format: decimal
          description: Importe total almacenado de la factura. Se devuelve como número JSON. En los registros de anulación es `0`.
          example: 121.61
        tax_breakdown:
          type: array
          description: Desglose fiscal completo almacenado del registro. Cada entrada incluye todas sus propiedades, con `null` en los campos sin valor. En los registros de anulación se devuelve un array vacío (`[]`).
          items:
            $ref: "#/components/schemas/InvoiceTaxBreakdown"
        fingerprint:
          nullable: true
          type: string
          description: Huella SHA-256 del registro de facturación registrado.
        csv:
          nullable: true
          type: string
          description: |
            Código Seguro de Verificación (CSV) que la AEAT emite en la respuesta a la remisión. Acredita la remisión, no cada registro individual.

            **Un `csv` vacío (`null`) no significa que el registro no esté acreditado.** La AEAT no devuelve el CSV en consultas posteriores, por lo que un registro aceptado puede no tenerlo; por ejemplo, cuando el resultado del envío no llegó (timeout o respuesta ilegible) y se confirmó después con una consulta de estado. Para saber si un registro está acreditado, usa `vf_record_registration_status`, no la presencia del `csv`.

            En los envíos diferidos por lote, todos los registros del mismo envío comparten el mismo CSV, también los rechazados. Solo se omite si la AEAT rechaza todos los registros del envío.

            Un reenvío no borra un CSV ya guardado cuando la nueva respuesta no incluye uno. Un CSV nuevo sustituye al anterior. [Leer más en la FAQ](/faq).
        vf_post_status:
          $ref: "#/components/schemas/vf_post_status"
        vf_record_registration_status:
          $ref: "#/components/schemas/vf_record_registration_status"
        has_warnings:
          type: boolean
          description: Indica si el registro contiene errores que deban ser subsanados.
          example: false
        vf_error_descriptions:
          nullable: true
          type: string
          description: Cadena con la descripción de los errores devueltos por Veri*Factu.

    InvoiceTaxBreakdown:
      type: object
      description: Entrada del desglose fiscal devuelto en el listado de registros de facturación.
      required:
        - tax_type_key
        - vat_tax_regime_key
        - igic_tax_regime_key
        - ipsi_tax_regime_key
        - operation_type_key
        - exemption_cause_key
        - tax_base
        - tax_base_at_cost
        - tax_rate
        - tax_quota
        - equalization_tax_rate
        - equalization_tax_quota
      properties:
        tax_type_key:
          $ref: "#/components/schemas/tax_type_key"
        vat_tax_regime_key:
          type: string
          nullable: true
          description: Clave del régimen de IVA almacenada. Es `null` cuando no tiene valor.
          enum: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "14", "15", "17", "18", "19", "20", null]
        igic_tax_regime_key:
          type: string
          nullable: true
          description: Clave del régimen de IGIC almacenada. Es `null` cuando no tiene valor.
          enum: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "14", "15", "17", "18", "19", null]
        ipsi_tax_regime_key:
          type: string
          nullable: true
          description: Clave del régimen de IPSI almacenada. Es `null` cuando no tiene valor.
          enum: ["01", "08", "11", "18", "19", "20", null]
        operation_type_key:
          type: string
          nullable: true
          description: Clave del tipo de operación almacenada. Es `null` cuando no tiene valor, por ejemplo en operaciones exentas.
          enum: ["S1", "S2", "N1", "N2", null]
        exemption_cause_key:
          type: string
          nullable: true
          description: Clave de la causa de exención almacenada. Es `null` cuando no tiene valor.
          enum: ["E1", "E2", "E3", "E4", "E5", "E6", null]
        tax_base:
          type: number
          format: decimal
          description: Base imponible o importe no sujeto almacenado.
          example: 100.50
        tax_base_at_cost:
          type: number
          format: decimal
          nullable: true
          description: Base imponible a coste almacenada. Es `null` cuando no tiene valor.
        tax_rate:
          type: number
          format: decimal
          nullable: true
          description: Tipo impositivo almacenado, expresado en porcentaje. Es `null` cuando no tiene valor.
          example: 21.00
        tax_quota:
          type: number
          format: decimal
          nullable: true
          description: Cuota del impuesto almacenada. Es `null` cuando no tiene valor.
          example: 21.11
        equalization_tax_rate:
          type: number
          format: decimal
          nullable: true
          description: Tipo de recargo de equivalencia almacenado, expresado en porcentaje. Es `null` cuando no tiene valor.
          example: 5.20
        equalization_tax_quota:
          type: number
          format: decimal
          nullable: true
          description: Cuota de recargo de equivalencia almacenada. Es `null` cuando no tiene valor.
          example: 5.23
      example:
        tax_type_key: "01"
        vat_tax_regime_key: "01"
        igic_tax_regime_key: null
        ipsi_tax_regime_key: null
        operation_type_key: "S1"
        exemption_cause_key: null
        tax_base: 100.50
        tax_base_at_cost: null
        tax_rate: 21.00
        tax_quota: 21.11
        equalization_tax_rate: null
        equalization_tax_quota: null

    ListInvoicesResponse:
