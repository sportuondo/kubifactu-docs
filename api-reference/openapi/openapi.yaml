          items:
            $ref: "#/components/schemas/sif"

    CreateSIFResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/sif"

    sif:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único del SIF.
          example: "9dccd6c6-08f8-490d-a370-bfef724c0855"
        company_name:
          type: string
          description: Nombre de la empresa asociada al SIF.
          example: "Empresa de ejemplo"
        tax_id_number:
          type: string
          description: NIF/CIF de la empresa asociada al SIF.
          example: "S6271969E"
        other_country_code:
          $ref: "#/components/schemas/other_country_code"
        other_tax_id_type_key:
          $ref: "#/components/schemas/other_tax_id_type_key"
        other_tax_id_number:
          type: string
          description: >
            Número de identificación en el país de residencia de la empresa. Ejemplo: `L74JF44L2` para una empresa de `DE`.
        name:
          type: string
          description: Nombre del SIF.
          example: "SIF 0001"
        sif_id:
          type: string
          description: Identificador del SIF para Veri*Factu.
          example: "DC"
        version:
          type: string
          description: Versión del SIF.
          example: "1.0.0"
        installation_number:
          type: string
          description: Número de instalación asociado al SIF.
          example: "BM1WJ36SS5MOL6LWPLHTMBFUOTQO5TNDU2ILL34JG6FLSVAUMD1I0G41AS7PC870QAHHIOWJSBPKRB2XELRCUWO4TSJ8XY0UPAML"
        only_verifactu_use_key:
          type: string
          description: |
            Indica si el SIF es solo para uso de Veri*Factu.
            Valores posibles: `S` (Sí), `N` (No).
          example: "S"
        multi_ot_key:
          type: string
          description: |
            Indica si el SIF admite operaciones de registros de facturación de múltiples empresas.
            Valores posibles: `S` (Sí), `N` (No).
          example: "N"
        supporting_multiple_ots_key:
          type: string
          description: |
            Indica si el SIF soporta actualmente el procesamiento de registros de facturación de múltiples empresas.
            Valores posibles: `S` (Sí), `N` (No).
          example: "N"

    invoice_type_key:
      type: string
      description: |
        Especificación del tipo de factura: factura completa, factura simplificada, factura emitida en sustitución de facturas simplificadas o factura rectificativa.
        - `F1`: Factura (art. 6, 7.2 y 7.3 del RD 1619/2012).
        - `F2`: Factura Simplificada y Facturas sin identificación del destinatario art. 6.1.d) RD 1619/2012.
        - `F3`: Factura emitida en sustitución de facturas simplificadas facturadas y declaradas.
        - `R1`: Factura Rectificativa (Error fundado en derecho y Art. 80 Uno Dos y Seis LIVA)
        - `R2`: Factura Rectificativa (Art. 80.3)
        - `R3`: Factura Rectificativa (Art. 80.4)
        - `R4`: Factura Rectificativa (Resto)
        - `R5`: Factura Rectificativa en facturas simplificadas
      example: "F1"
      enum:
        - F1
        - F2
        - F3
        - R1
        - R2
        - R3
        - R4
        - R5

    other_tax_id_type_key:
      type: string
      description: |
        Clave para identificar el tipo de documento. Los valores posibles son:

        - `02`: **NIF-IVA**: Número de Identificación Fiscal para IVA.
        - `03`: **Pasaporte**: Documento oficial que acredita la identidad y nacionalidad del portador.
        - `04`: **Documento oficial de identificación expedido por el país o territorio de residencia**.
        - `05`: **Certificado de residencia**: Documento que acredita la residencia fiscal.
        - `06`: **Otro documento probatorio**: Documento adicional que sirve como prueba de identidad.
        - `07`: **No censado**: El receptor no está registrado en el censo fiscal.
      enum:
        - "02"
        - "03"
        - "04"
        - "05"
        - "06"
        - "07"

    other_country_code:
      type: string
      description: >
        Código del país en formato [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-2). Sólo es necesario rellenarlo **si el sujeto no es nacional**. El código de país debe ser `ES` si `other_tax_id_type_key` es `07 (no censado)`. Ejemplo: `DE`

    affected_by_incidence_key:
      type: string
      description: |
        Indicador que especifica si la remisión voluntaria del registro de facturación se ha visto afectada por algún tipo de incidencia técnica (ausencia de corriente eléctrica, problemas de conexión a Internet, fallo del sistema informático de facturación, etc.). Si no se informa este campo se entenderá que tiene valor “N”.

        - `S`: Sí, la remisión de este registro de facturación se ha visto afectada por aglún tipo de incidencia.
        - `N`: No
      enum:
        - S
        - N

    previous_rejection_key:
      type: string
      description: |
        Indicador de rechazo previo que, en las subsanaciones, distingue si la factura **ya está registrada en la AEAT** o si se subsana **sin registro previo**.

        En una subsanación se informa `correction_key = S` y se utiliza el valor de `previous_rejection_key` que corresponda a la situación de la factura en la AEAT.

        Un rechazo **no debe confundirse con un error técnico en el envío** (timeout, error de red, fallo del servicio, ausencia de respuesta, error SOAP, etc.) que tendrá el campo `vf_post_status = failure`. En esos casos **el registro no se considera rechazado**, y debe **reenviarse exactamente igual**, **sin modificar datos** y **sin informar** `correction_key` ni `previous_rejection_key`. [Ver más información al respecto](/faq#¿qué-debo-hacer-si-no-puedo-enviar-un-registro-porque-veri-factu-tiene-problemas-técnicos-de-conexión).

        - `X`: El alta inicial fue **rechazada** y la factura **no está registrada en la AEAT**. También corresponde a las operativas especiales de **subsanación sin registro previo**. Solo puede informarse cuando `correction_key = S`; **no significa simplemente que el último envío fue rechazado**.
        - `S`: La factura **ya está registrada en la AEAT**, pero una subsanación posterior fue **rechazada**. Solo puede informarse cuando `correction_key = S`.
        - `N` u omitido: En una subsanación habitual de una factura **ya registrada en la AEAT**, se informa `correction_key = S`. También corresponde a un alta normal/inicial, sin subsanación.

        Con `correction_key = S` y `previous_rejection_key = X`, la API busca en KubiFACTU un registro de alta de la misma factura (mismo número y mismo ejercicio o fecha de expedición, en la misma empresa cliente) y devuelve HTTP `422` con el error en `previous_rejection_key` si ese registro:

        - Está **registrado en la AEAT** (`vf_record_registration_status` = `success`, `accepted_with_errors` o `cancelled`). La AEAT rechazaría la subsanación como registro duplicado (código 3000), porque con `X` la factura no debe existir previamente en la AEAT. No envíes `X`: para corregir el contenido del registro aceptado, envía la subsanación con `previous_rejection_key = N`.
        - Está **pendiente de envío** a la AEAT. Espera a conocer su resultado, mediante `callback_url` o consultando el registro, antes de decidir cómo subsanarlo.

        `X` sigue admitiéndose cuando el alta original fue rechazada (`failed`), no está registrada (`not_registered`) o no existe en KubiFACTU.
      enum:
        - X
        - S
        - N

    correction_key:
      type: string
      description: |
        Indicador que especifica que se trata de una subsanación de un registro de facturación de alta previamente generado, con o sin registro previo en la AEAT según el valor de `previous_rejection_key`. El contenido de este nuevo registro de facturación es el correcto y el que deberá tenerse en cuenta. Si no se informa este campo, se entenderá que tiene valor `N` (alta normal/inicial). [Ver más información al respecto](/faq#¿qué-debo-hacer-cuando-veri-factu-“acepta-con-errores”-una-de-mis-facturas).

        - `S`: Sí, se trata de una subsanación; debe utilizarse con el valor de `previous_rejection_key` que corresponda.
        - `N`: No, se trata de un alta normal/inicial.
      enum:
        - S
        - N

    simplified_invoice_key:
      type: string
      description: |
        Factura simplificada Articulo 7.2 Y 7.3 RD 1619/2012.

        Si no se informa este campo se entenderá que tiene valor `N`.

        Sólo se podrá rellenar con `S` si `invoice_type_key` es `F1`, `F3`, `R1`, `R2`, `R3` o `R4`.

        - `S`: Sí
        - `N`: No
      enum:
        - S
        - N

    without_recipient_identification_key:
      type: string
      description: |
        Factura sin identificación del destinatario según el artículo 6.1.d del RD 1619/2012.

        Si no se informa este campo, se entenderá que tiene valor `"N"`.

        Sólo se podrá rellenar con `"S"` si `invoice_type_key` es `F2` o `R5`.

        - `S`: Sí
        - `N`: No
      enum:
        - S
        - N

    macrodata_key:
      type: string
      description: |
        Identificador que especifica aquellas facturas con base o importe >= |100.000.000,00| (valor absoluto).

        Si no se informa este campo, se entenderá que tiene valor `"N"`.

        Sólo se podrá rellenar con `"S"` si `invoice_type_key` es `F2` o `R5`.

        - `S`: Sí
        - `N`: No
      enum:
        - S
        - N

    coupon_key:
      type: string
      description: |
        Identificador que especifica si tiene minoración de la base imponible por la concesión de cupones, bonificaciones o descuentos cuando solo se expide el original de la factura.
        Si no se informa este campo, se entenderá que tiene valor `"N"`.

        Sólo se podrá rellenar con `"S"` si `invoice_type_key` es `R5` o `R1`.
      enum:
        - "S"
        - "N"
      example: "N"

    tax_type_key:
      type: string
      description: |
        Impuesto de aplicación. Los valores posibles son:

        - `01`: Impuesto sobre el Valor Añadido (IVA).
        - `02`: Impuesto sobre la Producción, los Servicios y la Importación (IPSI) de Ceuta y Melilla.
        - `03`: Impuesto General Indirecto Canario (IGIC).
        - `05`: Otros.

        En las peticiones, `vat_tax_regime_key` solo corresponde a `01`, `ipsi_tax_regime_key` a `02` y `igic_tax_regime_key` a `03`. Para `05` no se informa una clave de régimen. Estas opciones documentan los tipos admitidos por la API; no representan cobertura completa de todos los impuestos o regímenes IPSI.
      enum:
        - "01"
        - "02"
        - "03"
        - "05"

    vat_tax_regime_key:
      type: string
      description: |
        Clave que identificará el tipo de régimen del impuesto o una operación con trascendencia tributaria en el contexto del IVA. Este campo no debe incluirse si se está incluyendo `igic_tax_regime_key` o `tax_type_key` tiene un valor diferente de `01`. Los valores posibles son:

        - `01`: Operación de régimen general.
        - `02`: Exportación.
        - `03`: Operaciones a las que se aplique el régimen especial de bienes usados, objetos de arte, antigüedades y objetos de colección.
        - `04`: Régimen especial del oro de inversión.
        - `05`: Régimen especial de las agencias de viajes.
        - `06`: Régimen especial grupo de entidades en IVA (Nivel Avanzado).
        - `07`: Régimen especial del criterio de caja.
        - `08`: Operaciones sujetas al IPSI / IGIC (Impuesto sobre la Producción, los Servicios y la Importación / Impuesto General Indirecto Canario).
        - `09`: Facturación de las prestaciones de servicios de agencias de viaje que actúan como mediadoras en nombre y por cuenta ajena (D.A.4ª RD1619/2012).
        - `10`: Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades, asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro.
        - `11`: Operaciones de arrendamiento de local de negocio.
        - `14`: Factura con IVA pendiente de devengo en certificaciones de obra cuyo destinatario sea una Administración Pública.
        - `15`: Factura con IVA pendiente de devengo en operaciones de tracto sucesivo.
        - `17`: Operación acogida a alguno de los regímenes previstos en el Capítulo XI del Título IX (OSS e IOSS).
        - `18`: Recargo de equivalencia.
        - `19`: Operaciones de actividades incluidas en el Régimen Especial de Agricultura, Ganadería y Pesca (REAGYP).
        - `20`: Régimen simplificado.
      enum:
        - "01"
        - "02"
        - "03"
        - "04"
        - "05"
        - "06"
        - "07"
        - "08"
        - "09"
        - "10"
        - "11"
        - "14"
        - "15"
        - "17"
        - "18"
        - "19"
        - "20"

    ipsi_tax_regime_key:
      type: string
      description: |
        Clave del régimen de IPSI aplicable a una operación sujeta a este impuesto. Es obligatoria para las nuevas peticiones con `tax_type_key: "02"` desde esta actualización. No se deben incluir `vat_tax_regime_key` ni `igic_tax_regime_key` en esas peticiones; las claves de régimen IPSI tampoco son compatibles con otros tipos impositivos. Los valores admitidos son:

        - `01`: Régimen general.
        - `08`: Operaciones sujetas al IGIC / IVA.
        - `11`: Arrendamiento de local de negocio.
        - `18`: Operaciones a que se refiere el artículo 73, apartados 4 y 5, de la Ordenanza fiscal del IPSI (solo aplicable en Ceuta).
        - `19`: Operaciones interiores exentas.
        - `20`: Régimen de estimación objetiva.
      enum: ["01", "08", "11", "18", "19", "20"]

    igic_tax_regime_key:
      type: string
      description: |
        Clave que identificará el tipo de régimen del impuesto o una operación con trascendencia tributaria en el contexto del IGIC. Este campo no debe incluirse se se está incluyendo `vat_tax_regime_key`. Los valores posibles son:

        - `01`: Operación de régimen general.
        - `02`: Exportación.
        - `03`: Operaciones a las que se aplique el régimen especial de bienes usados, objetos de arte, antigüedades y objetos de colección.
        - `04`: Régimen especial del oro de inversión.
        - `05`: Régimen especial de las agencias de viajes.
        - `06`: Régimen especial grupo de entidades en IGIC (Nivel Avanzado).
        - `07`: Régimen especial del criterio de caja.
        - `08`: Operaciones sujetas al IPSI / IVA (Impuesto sobre la Producción, los Servicios y la Importación / Impuesto sobre el Valor Añadido).
        - `09`: Facturación de las prestaciones de servicios de agencias de viaje que actúan como mediadoras en nombre y por cuenta ajena (D.A.4ª RD1619/2012).
        - `10`: Cobros por cuenta de terceros de honorarios profesionales o de derechos derivados de la propiedad industrial, de autor u otros por cuenta de sus socios, asociados o colegiados efectuados por sociedades, asociaciones, colegios profesionales u otras entidades que realicen estas funciones de cobro.
        - `11`: Operaciones de arrendamiento de local de negocio.
        - `14`: Factura con IGIC pendiente de devengo en certificaciones de obra cuyo destinatario sea una Administración Pública.
        - `15`: Factura con IGIC pendiente de devengo en operaciones de tracto sucesivo.
        - `17`: Régimen especial de comerciante minorista.
        - `18`: Régimen especial del pequeño empresario o profesional.
        - `19`: Operaciones interiores exentas por aplicación artículo 25 Ley 19/1994.
      enum:
        - "01"
        - "02"
        - "03"
        - "04"
        - "05"
        - "06"
        - "07"
        - "08"
        - "09"
        - "10"
        - "11"
        - "14"
        - "15"
        - "17"
        - "18"
        - "19"

    operation_type_key:
      type: string
      description: |
        Código que identifica el tipo de operación según su sujeción o exención tributaria. Los valores posibles son:

        - `S1`: Operación Sujeta y No exenta - Sin inversión del sujeto pasivo.
        - `S2`: Operación Sujeta y No exenta - Con Inversión del sujeto pasivo.
        - `N1`: Operación No Sujeta artículo 7, 14, otros.
        - `N2`: Operación No Sujeta por Reglas de localización.
      enum:
        - "S1"
        - "S2"
        - "N1"
        - "N2"

    exemption_cause_key:
      type: string
      description: |
        Causa de la exención. Los valores posibles son:

        - `E1`: Exenta por el artículo 20.
        - `E2`: Exenta por el artículo 21.
        - `E3`: Exenta por el artículo 22.
        - `E4`: Exenta por los artículos 23 y 24.
        - `E5`: Exenta por el artículo 25.
        - `E6`: Exenta por otros.
      enum:
        - "E1"
        - "E2"
        - "E3"
        - "E4"
        - "E5"
        - "E6"

    rectificative_type_key:
      type: string
      description: |
        Campo que identifica si el tipo de factura rectificativa es por **sustitución** o por **diferencias**.

        - `S`: Por sustitución.
        - `I`: Por diferencias.
      enum:
        - "S"
        - "I"

    vf_post_status:
      nullable: true
      type: string
      description: |
        Este campo indica si la factura ha sido enviada a Veri*Factu, pero no indica si el registro ha sido aceptado.
        Los valores posibles son:

        - `success`: Se ha realizado el envío a Veri*Factu.
        - `failure`: Ha fallado el envío a Veri*Factu o Veri*Factu ha respondido con un error. Un timeout identificable se combina con `vf_record_registration_status = unknown`: no demuestra que la AEAT no haya recibido el registro y no activa por sí solo la conciliación obligatoria.
      enum:
        - "success"
        - "failure"

    vf_record_registration_status:
      nullable: true
      type: string
      description: |
        Valores posibles para el campo `vf_record_registration_status`, que indican el estado del registro en Veri*Factu.

        - `success`: El registro ha sido correctamente registrado en Veri*Factu.
        - `accepted_with_errors`: El registro ha sido registrado en Veri*Factu, pero tiene **errores que deben ser subsanados**.
        - `failed`: El registro tiene errores no aceptables y ha sido **rechazado** por Veri*Factu.
        - `not_registered`: No se ha encontrado el registro en Veri*Factu.
        - `cancelled`: El registro está anulado.
        - `unknown`: Se desconoce el estado del registro. Puede acompañar a `vf_post_status = failure` tras un timeout identificable. Si el envío está en `success`, exige conciliación antes del reenvío manual.
      enum:
        - "success"
        - "accepted_with_errors"
        - "failed"
        - "not_registered"
        - "cancelled"
        - "unknown"

    record_type:
      type: string
      description: |
        Tipo de registro de facturación:

        - `creation`: Se trata de un registro de alta.
        - `cancellation`: Se trata de un registro de anulación.
      enum:
        - "creation"
        - "cancellation"

    InvoiceSubmissionBlockedErrorResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code, message, errors, details]
              properties:
                code:
                  type: string
                  enum: [E-INVOICE-SUBMISSION-BLOCKED]
                  description: Código de bloqueo del envío por conciliación pendiente del propio registro o por un registro anterior de la cadena.
                message:
                  type: string
                  description: Mensaje descriptivo del bloqueo.
                errors:
                  type: object
                  required: [reason, blocking_invoice_id]
                  properties:
                    reason:
                      type: string
                      enum: [pending_submission, unresolved_submission, pending_reconciliation]
                      description: |
                        Motivo del bloqueo:
                        - `pending_submission`: el registro anterior está pendiente de envío.
                        - `unresolved_submission`: el envío anterior necesita resolverse, por ejemplo tras un timeout, un resultado desconocido o una conciliación pendiente de un reenvío duplicado. También se aplica si se ha confirmado que el registro no está registrado y su envío sigue pendiente de resolver.
                        - `pending_reconciliation`: el propio registro solicitado para reenvío necesita confirmar su resultado en la AEAT antes de permitir otro envío manual.
                    blocking_invoice_id:
                      type: string
                      format: uuid
                      description: UUID en KubiFACTU del propio registro pendiente de conciliación si el motivo es `pending_reconciliation`; para `pending_submission` o `unresolved_submission`, identifica el primer registro anterior que bloquea la cadena de la misma empresa cliente y el mismo SIF.
                details:
                  type: object
                  nullable: true
                  enum: [null]
                  description: Siempre es `null` en esta respuesta.
                  example: null

    ValidationErrorResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Mensaje general del error.
                  example: "The given data was invalid."
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  description: |
                    Lista de errores de validación organizados por campo.
                    Cada clave es el nombre del campo asociado al error y contiene un array de mensajes.
                  example:
                    invoice_exists:
                      - "An invoice already exists with the indicated invoice number and fiscal for the provided SIF. Existing invoice ID: [9db6bb78-6799-4abb-b9a0-22d127c543ed]."
                    incorrect_total_quota:
                      - "The total quota of the invoice does not match the total tax quota and equalization_tax_quota of the tax breakdown. Calculated total quota: [26.25]."
                    incorrect_total_amount:
                      - "The total amount of the invoice does not match the total tax base of the tax breakdown. Calculated total amount: [151.25]."
                details:
                  type: object
                  properties:
                    request_id:
                      type: string
                      format: uuid
                      description: Identificador único de la solicitud para rastreo.
                      example: "9ded9e2c-d59e-4432-a926-652cbcfac365"

    UnauthorizedApiKeyErrorResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  description: Código de error que indica el tipo de problema.
                  example: "E-UNAUTH-APIKEY"
                message:
                  type: string
                  description: Mensaje detallado del error.
                  example: "No client with API-KEY '5tVySMGJOpq8HfMgIX28Qz6kF0dFOoq37x55PLZcWsGeGeYkNgJyAcRTlFJ5NbVoDRm8qtCywEoiN3A9JkBanMBXYmxiqR3BItxgxx' was found."
                http_code:
                  type: integer
                  description: Código HTTP asociado al error.
                  example: 403
                errors:
                  type: object
                  nullable: true
                  description: |
                    Detalles adicionales del error. Puede ser `null` si no hay información específica.
                  example: null
                details:
                  type: object
                  properties:
                    request_id:
                      type: string
                      description: Identificador único de la solicitud para rastreo.
                      example: "2cc8ef846029ec69613711ad1d85f6dfebf16ffb"

    VerifactuHealthCheckResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            available:
              type: boolean
              description: Indica si el servicio Veri*Factu está disponible.
              example: true
            http_status_code:
              type: integer
              nullable: true
              description: Código de estado HTTP devuelto por el servicio Veri*Factu en la última comprobación.
              example: 200
            error_message:
              type: string
              nullable: true
              description: Mensaje de error si el servicio no está disponible o ha fallado la comprobación.
              example: null
            environment:
              type: string
              description: |
                Entorno de Veri*Factu sobre el que se ha realizado la comprobación.
                Valores posibles: `PROD`, `DEV`.
              example: "PROD"
            checked_at:
              type: string
              format: date-time
              description: Fecha y hora de la última comprobación en formato ISO 8601.
              example: "2025-01-15T10:30:00+00:00"

    NotFoundErrorResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            error:
              type: object
              properties:
                message:
                  type: string
                  description: Mensaje detallado del error.
                  example: "Client Company with id [0195fa87-a315-710a-8aa2-25e1d690f6tr] not found."
                errors:
                  type: object
                  nullable: true
                  description: |
                    Detalles adicionales del error. Puede ser `null` si no hay información específica.
                  example: null
                details:
                  type: object
                  properties:
                    request_id:
                      type: string
                      description: Identificador único de la solicitud para rastreo.
                      example: "2cc8ef846029ec69613711ad1d85f6dfebf16ffb"


  securitySchemes:
    client_api_key:
      type: apiKey
      name: X-Qbikode-ClientApiKey
      in: header
      description: |
        API-KEY de la empresa que hace la petición. Este dato se puede consultar en el panel web, accediendo a la sección _Empresas_ y accediendo a la ficha de la empresa en.

    owner_api_key:
      type: apiKey
      name: X-Qbikode-UserApiKey
      in: header
      description: |
        API-KEY del intermediario que hace la petición. Este dato se puede consultar en el panel web, en la página de _Perfil de usuario_.
