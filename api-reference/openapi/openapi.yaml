components:
  schemas:
    CreateClientCompanyRequest:
      type: object
      properties:
        company_name:
          type: string
          description: Nombre de la empresa.
          example: "Empresa de ejemplo"
        tax_id_number:
          type: string
          description: NIF/CIF de la empresa.
          example: "S6271969E"
        email:
          type: string
          format: email
          description: Correo electrónico de la empresa.
          example: "empresa@prueba.net"
      required:
        - company_name
        - tax_id_number
        - email

    UpdateClientCompanyRequest:
      type: object
      properties:
        company_name:
          type: string
          description: Nombre de la empresa.
          example: "Empresa de ejemplo"
        tax_id_number:
          type: string
          description: NIF/CIF de la empresa.
          example: "S6271969E"
        email:
          type: string
          format: email
          description: Correo electrónico de la empresa.
          example: "empresa@prueba.net"
      required:
        - company_name
        - tax_id_number
        - email

    UpdateClientCompanyCertificateRequest:
      type: object
      properties:
        certificate_file:
          type: string
          format: binary
          description: Certificado digital de la empresa en formato archivo.
        certificate_password:
          type: string
          description: Contraseña del certificado digital.
          example: "passwd"
      required:
        - certificate_file
        - certificate_password

    UploadAuthorizationDocumentsRequest:
      type: object
      properties:
        authorization_document:
          type: string
          format: binary
          description: |
            Documento de autorización firmado. Formatos permitidos: PDF, JPG, JPEG, PNG.
            Tamaño máximo: 25MB.
        identity_document:
          type: string
          format: binary
          description: |
            Documento de identidad del representante legal. Sólo necesario si el documento de autorización no está firmado digitalmente por el cliente. Formatos permitidos: PDF, JPG, JPEG, PNG.
            Tamaño máximo: 25MB.
        authorization_document_has_digital_signature:
          type: boolean
          description: |
            Indicador de que el documento de autorización está firmado digitalmente con el certificado digital del cliente.
            Solo se tiene en cuenta cuando se envía `authorization_document`.
      description: |
        Al menos uno de los dos documentos es requerido.
        El campo `authorization_document_has_digital_signature` permite indicar firma digital en el documento de autorización y, en ese caso, considerar opcional el documento de identidad para la lógica de completitud.

    UploadAuthorizationDocumentsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              description: Mensaje de confirmación.
              example: "Documents uploaded successfully."
            authorization_document:
              type: string
              nullable: true
              description: Nombre del archivo de autorización guardado.
              example: "auth_20260129153045.pdf"
            identity_document:
              type: string
              nullable: true
              description: Nombre del archivo de identidad guardado.
              example: "identity_20260129153046.jpg"

    CreateClientCompanySifRequest:
      type: object
      properties:
        company_name:
          type: string
          description: Nombre de la empresa.
          example: "Empresa de ejemplo"
        tax_id_number:
          type: string
          description: NIF/CIF de la empresa.
          example: "S6271969E"
        other_country_code:
          $ref: "#/components/schemas/other_country_code"
        other_tax_id_type_key:
          $ref: "#/components/schemas/other_tax_id_type_key"
        other_tax_id_number:
          type: string
          description: >
            Número de identificación en el país de residencia del sujeto. Ejemplo: `L74JF44L2` para una empresa de `DE`.
        name:
          type: string
          description: Nombre del SIF.
          maxLength: 30
          example: "SIF-0001"
        sif_id:
          type: string
          maxLength: 2
          description: |
            Identificador del SIF para Veri*Factu. Deberá distinguirse de otros posibles SIFs que produzca esta entidad productora.

            Deberá tener rellenadas siempre las dos posiciones, cada una de las cuales deberá ser una letra mayúscula, excepto la Ñ, o un dígito numérico.
        version:
          type: string
          description: Versión en formato X.Y.Z del SIF.
          example: "1.0.0"
        installation_number:
          type: string
          maxLength: 100
          description: Número de instalación del sistema informático de facturación (SIF) utilizado. Deberá distinguirse de otros posibles SIF utilizados para realizar la facturación del obligado a expedir facturas, es decir, de otras posibles instalaciones de SIF pasadas, presentes o futuras utilizadas para realizar la facturación del obligado a expedir facturas, incluso aunque en dichas instalaciones se emplee el mismo SIF de un productor.
          example: "LQLFBFLMUSLAEMU7SC2BROSETQU7SSRIKJDRW2QHVMCPE574M4JORYRDLWPS3NRXWJ3APCNKWWXO771GSIO731KXTAUPIMXWV33Y"
      required:
        - company_name
        - tax_id_number
        - name
        - sif_id
        - version
        - installation_number

    CreateBatchOfInvoicesRecordsRequest:
      type: object
      required:
        - invoices
      properties:
        invoices:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            Array de registros de facturación con la misma estructura que la del endpoint de **Enviar registro de facturación**.
          items:
            $ref: '#/components/schemas/CreateInvoiceRecordRequest'

    CreateInvoiceRecordRequest:
      type: object
      properties:
        client_invoice_id:
          type: string
          maxLength: 50
          description: |
            Identificador único de la factura **dentro del sistema del cliente**.
          example: "96f2044008d7iujfd78jspo4"

        callback_url:
          type: string
          format: url
          description: |
            Sólo aplicable a [registros de facturación en diferido](/basic-concepts#registros-de-facturación-diferidos) o reenvíos de regitros de facturación. URL a la que se llamará con el resultado de la AEAT al procesamiento del registro de facturación.

            Se hará una petición POST a esta URL y se enviarán un array en formato JSON con los datos de las facturas procesadas cuyos ítems contendrán los siguientes campos:

            - `id`: `string`. Identificador de KubiFACTU para el registro de facturación.
            - `client_invoice_id`: `string|null`. Identificador del cliente para el registro de facturación.
            - `record_type`: `string (creation|cancellation)`. Tipo de registro de facturación.
            - `sif_id`: `string`. ID del SIF utilizado para la creación del registro.
            - `sender_company_name`: `string`. Nombre de la empresa emisora.
            - `sender_tax_id_number`: `string`. CIF/NIF de la empresa emisora.
            - `fiscal_year`: `integer`. Año fiscal del registro de facturación.
            - `full_invoice_number`: `string`. Número de factura.
            - `fingerprint`: `string|null`. Huella del registro de facturación.
            - `csv`: `string|null`. Código Seguro de Verificación (CSV) de la remisión que contiene el registro. Puede ser `null` aunque el registro esté aceptado: para saber si está acreditado, usa `vf_record_registration_status`, no la presencia del `csv`. [Leer más en la FAQ](/faq).
            - `vf_post_status`: `string|null`. Ver valores posibles en la documentación del campo `vf_post_status` de la respuesta de envío de registros de facturación.
            - `vf_record_registration_status`: `string|null`. Ver valores posibles en la documentación del campo `vf_record_registration_status` de la respuesta de envío de registros de facturación.
            - `has_warnings`: `bool`. Indica si el registro contiene errores que deban ser subsanados.
            - `vf_error_descriptions`: `string|null`. Cadena con la descripción de los errores devueltos por Veri*Factu.
            - `vf_response_body`: `string|null`. Cuerpo de la respuesta de Veri*Factu en formato Base64. Contiene el XML completo devuelto por la AEAT tras el envío del registro de facturación.
            - `xml_url`: `string|null`. URL para descargar el XML del registro de facturación enviado a Veri*Factu mediante el endpoint [Descargar XML del registro de facturación](/openapi-reference/descargar-xml-del-registro-de-facturación). Será `null` si el XML aún no está disponible.
            - `qr_value`: `string|null`. URL del código QR para validación de la factura en Veri*Factu. Será `null` si el registro fue rechazado o no aplica mostrar QR.
            - `qr_image_url`: `string|null`. URL para descargar la imagen PNG del código QR generado por KubiFACTU mediante el endpoint [Descargar imagen QR del registro de facturación](/openapi-reference/descargar-imagen-qr-del-registro-de-facturación). Será `null` si el registro fue rechazado o no aplica mostrar QR.
          example: "https://www.tuempresa.com/kubifactu/callback"

        sif_id:
          type: string
          format: uuid
          description: |
            ID del SIF que se quiere utilizar para el envío de la factura. Los SIFs se pueden registrar en el panel web de KubiFACTU.

            Un SIF puede procesar registros de facturación de diferentes empresas.

            Una empresa puede tener uno o varios SIFs. Por ejemplo, una empresa con varias tiendas puede operar con un SIF por cada establecimiento, de forma que el encadenamiento/trazabilidad de las facturas se trate por separado.
          example: "9db0bca1-187e-4cf4-b87c-96f2044008d7"

        invoice_type_key:
          $ref: "#/components/schemas/invoice_type_key"

        sender_data:
          type: object
          description: Información referente al emisor de la factura.
          required:
            - company_name
            - tax_id_number
          properties:
            company_name:
              type: string
              description: Nombre de la empresa emisora.
            tax_id_number:
              type: string
              description: NIF/CIF de la empresa emisora.

        recipients:
          type: array
          description: Información de los receptores de la factura. Obligatorio para facturas ordinarias.
          items:
            type: object
            required:
              - company_name
            properties:
              company_name:
                type: string
                description: Nombre de la empresa receptora.
              tax_id_number:
                type: string
                description: >
                  NIF/CIF de la empresa receptora. Este campo es obligatorio si el receptor es nacional y se identifica mediante CIF/NIF.
              other_country_code:
                $ref: "#/components/schemas/other_country_code"
              other_tax_id_type_key:
                $ref: "#/components/schemas/other_tax_id_type_key"
              other_tax_id_number:
                type: string
                description: >
                  Número de identificación en el país de residencia del destinatario de la operación de la factura expedida. Ejemplo: `L74JF44L2` para una empresa de `DE`.

        representative_company_name:
          type: string
          description: |
            Nombre/razón social del representante del obligado tributario.
            A rellenar solo en caso de que el registro de facturación remitido haya sido generado por un representante/asesor del obligado tributario.

        representative_tax_id_number:
          type: string
          description: |
            NIF del representante del obligado tributario.
            A rellenar solo en caso de que el registro de facturación remitido haya sido generado por un representante/asesor del obligado tributario.

        previous_rejection_key:
          $ref: "#/components/schemas/previous_rejection_key"

        correction_key:
          $ref: "#/components/schemas/correction_key"

        full_invoice_number:
          type: string
          description: |
            Serie+Nº Factura que identifica a la factura emitida. Sólo puedo contener caracteres ASCII del 32 a 126 (caracteres imprimibles).
            Ejemplo: `2026-00001`.
          example: "2026-00001"

        fiscal_year:
          type: integer
          description: |
            Ejercicio fiscal en el que se emite la factura. Aunque este dato no se envía a la AEAT, se utiliza junto con el `sif_id` para verificar que no se están duplicando los números de factura.
          example: 2026

        issue_date:
          type: string
          format: date
          example: "2026-09-15"
          description: |
            Fecha de expedición del registro de facturación.

            No puede ser una fecha futura.

        operation_date:
          type: string
          format: date
          description: |
            Fecha en la que se ha realizado la operación, siempre que sea diferente a la fecha de expedición. Determina el ejercicio y periodo fiscal al que pertenece la operación."

            Formato `yyyy-mm-dd`.
          example: "2026-02-26"

        operation_description:
          type: string
          description: |
            Descripción del objeto de la factura.

        tax_breakdown:
          type: array
          maxItems: 12
          description: |
            Anteriormente, este campo se denominaba `lines`. Este nombre sigue siendo válido como alias de retrocompatibilidad, pero las nuevas integraciones deben utilizar `tax_breakdown`.

            Desglose de la factura con la lista de los conceptos facturados **agrupados por condición fiscal completa**. El número máximo de líneas es de 12.

            Esta es la propiedad canónica para el desglose fiscal. Los errores de validación se devuelven usando la clave incluida en la petición. Si no se incluye ninguna clave compatible para el desglose, el error se devuelve en `tax_breakdown`.

            En el endpoint por lotes, la ruta de esta propiedad es `invoices.*.tax_breakdown` y cada factura se valida de forma independiente.

            El desglose debe agruparse por condición fiscal completa: `tax_rate` + `vat_tax_regime_key`, `ipsi_tax_regime_key` o `igic_tax_regime_key` (según `tax_type_key`) + `equalization_tax_rate` (si aplica). Esta agrupación responde a la condición fiscal de la operación, y no puede realizarse únicamente por tipo impositivo.

            A modo de ejemplo, indicar lo siguiente:

            ### Caso 1: Factura con todas las líneas al 21%
            Si las líneas al 21% se acogen a regímenes diferentes, deben generarse múltiples agrupaciones en el desglose, cada una con su combinación única de `tax_rate` + `vat_tax_regime_key`, `ipsi_tax_regime_key` o `igic_tax_regime_key` (según `tax_type_key`) + `equalization_tax_rate` (si aplica).

            Ejemplo válido:
            - Línea 1: 21%, régimen general
            - Línea 2: 21%, régimen criterio de caja

            El desglose debe contener dos entradas distintas, ambas con tipo 21%, pero con claves de régimen diferentes.

            ### Caso 2: Factura con líneas al 21% y al 10%

            Se pueden informar más de una clave de régimen por cada tipo impositivo, siempre que existan líneas que lo justifiquen.

            Ejemplo válido:
            - Línea 1: 21%, régimen general
            - Línea 2: 21%, régimen especial agencias
            - Línea 3: 10%, régimen general

            El desglose incluirá tres agrupaciones:
            1. 21% + régimen general
            2. 21% + régimen especial agencias
            3. 10% + régimen general
          items:
            type: object
            required:
              - operation_type_key
              - tax_base
            oneOf:
              - required: [tax_type_key, vat_tax_regime_key]
                properties:
                  tax_type_key:
                    type: string
                    enum: ["01"]
                not:
                  anyOf:
                    - required: [igic_tax_regime_key]
                    - required: [ipsi_tax_regime_key]
              - required: [tax_type_key, ipsi_tax_regime_key]
                properties:
                  tax_type_key:
                    type: string
                    enum: ["02"]
                not:
                  anyOf:
                    - required: [vat_tax_regime_key]
                    - required: [igic_tax_regime_key]
              - required: [tax_type_key, igic_tax_regime_key]
                properties:
                  tax_type_key:
                    type: string
                    enum: ["03"]
                not:
                  anyOf:
                    - required: [vat_tax_regime_key]
                    - required: [ipsi_tax_regime_key]
              - required: [tax_type_key]
                properties:
                  tax_type_key:
                    type: string
                    enum: ["05"]
                not:
                  anyOf:
                    - required: [vat_tax_regime_key]
                    - required: [ipsi_tax_regime_key]
                    - required: [igic_tax_regime_key]
            properties:
              tax_type_key:
                $ref: "#/components/schemas/tax_type_key"
              vat_tax_regime_key:
                $ref: "#/components/schemas/vat_tax_regime_key"
              igic_tax_regime_key:
                $ref: "#/components/schemas/igic_tax_regime_key"
              ipsi_tax_regime_key:
                $ref: "#/components/schemas/ipsi_tax_regime_key"
              operation_type_key:
                $ref: "#/components/schemas/operation_type_key"
              exemption_cause_key:
                $ref: "#/components/schemas/exemption_cause_key"
              tax_base:
                type: number
                format: decimal
                description: |
                  Magnitud dineraria sobre la que se aplica el tipo impositivo/importe no sujeto.
                  Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `200.00`.
                example: 200.00
              tax_base_at_cost:
                type: number
                format: decimal
                description: |
                  Magnitud dineraria sobre la que se aplica el tipo impositivo en **régimen especial de grupos nivel avanzado**.
                  Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `100.00`.
              tax_rate:
                type: number
                format: decimal
                description: |
                  Porcentaje aplicado sobre la base imponible para calcular la cuota.
                  Valor con 3 dígitos en la parte entera y 2 decimales. Ejemplo: `21.00`.
                example: 21.00
              tax_quota:
                type: number
                format: decimal
                description: |
                  Cuota resultante de aplicar a la base imponible el tipo impositivo.
                  Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `42.00`.
                example: 42.00
              equalization_tax_rate:
                type: number
                format: decimal
                description: |
                  Tipo de recargo de equivalencia asociado en función del impuesto y tipo impositivo.
                  Valor con 3 dígitos en la parte entera y 2 decimales. Ejemplo: `5.20`.
                example: 5.20
              equalization_tax_quota:
                type: number
                format: decimal
                description: |
                  Cuota de resultante de aplicar a la base imponible el tipo de recargo de equivalencia.
                  Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `10.40`.
                example: 10.40

        total_quota:
          type: number
          format: decimal
          description: |
            Importe total de la cuota (sumatorio de la cuota repercutida y cuota de recargo de equivalencia) de la factura.
            Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `33.57`.

        total_amount:
          type: number
          format: decimal
          description: |
            Importe total de la factura. Ʃ(`tax_base` + `tax_quota` + `equalization_tax_quota`) de todas las entradas de `tax_breakdown`.
            Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `2450.75`.

        simplified_invoice_key:
          $ref: "#/components/schemas/simplified_invoice_key"

        without_recipient_identification_key:
          $ref: "#/components/schemas/without_recipient_identification_key"

        macrodata_key:
          $ref: "#/components/schemas/macrodata_key"

        issued_by_third_party_or_recipient_key:
          type: string
          description: |
            Identificador que especifica si la factura ha sido expedida materialmente por un tercero o por el destinatario (contraparte).

            - Si es igual a `T` (tercero), el bloque `third_party_data` será de cumplimentación obligatoria.
            - Si es igual a `D` (destinatario), el bloque `recipients` será de cumplimentación obligatoria.

            - `T`: Tercero
            - `D`: Destinatario
          enum:
            - "T"
            - "D"

        third_party_data:
          type: object
          description: Información del tercero que expide la factura.
          required:
            - company_name
          properties:
            company_name:
              type: string
              description: Nombre de la empresa del tercero que expide la factura.
            tax_id_number:
              type: string
              description: >
                NIF/CIF de la empresa. Este campo es obligatorio si el tercero que expide la factura es nacional y se identifica mediante CIF/NIF
            other_country_code:
              $ref: "#/components/schemas/other_country_code"
            other_tax_id_type_key:
              $ref: "#/components/schemas/other_tax_id_type_key"
            other_tax_id_number:
              type: string
              description: >
                Número de identificación, en el país de residencia del tercero que expide la factura. Ejemplo: `L74JF44L2` para una empresa de `DE`.

        rectificative_type_key:
          $ref: "#/components/schemas/rectificative_type_key"

        rectified_tax_base:
          type: number
          format: decimal
          description: |
            Base imponible rectificada.
            Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `2500.55`.
          example: 2500.55

        rectified_tax_quota:
          type: number
          format: decimal
          description: |
            Cuota de impuesto rectificada.
            Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `42.30`.
          example: 42.30

        rectified_equalization_tax_quota:
          type: number
          format: decimal
          description: |
            Cuota de recargo de equivalencia rectificada.
            Valor con 12 dígitos en la parte entera y 2 decimales. Ejemplo: `5.20`.
          example: 5.20

        rectified_invoices:
          type: array
          description: |
            Lista de facturas que se están rectificando.
          items:
            type: object
            required:
              - tax_id_number
              - full_invoice_number
              - issue_date
            properties:
              tax_id_number:
                type: string
                description: |
                  NIF/CIF de la empresa emisora de la factura que quiere rectificar.
              full_invoice_number:
                type: string
                description: |
                  Serie+Nº Factura que identifica a la factura que se quiere rectificar.
                  Ejemplo: `2026-00001`.
              issue_date:
                type: string
                format: date
                description: |
                  Fecha de expedición de la factura que se quiere rectificar en formato `yyyy-mm-dd`.
                  Ejemplo: `2026-02-26`.
                example: "2026-02-26"

        substituted_invoices:
          type: array
          description: |
            Lista de facturas que se quieren sustituir.

            Sólo podrá incluirse esta agrupación cuando el campo `invoice_type_key` sea `F3`.
          items:
            type: object
            required:
              - tax_id_number
              - full_invoice_number
              - issue_date
            properties:
              tax_id_number:
                type: string
                description: |
                  NIF/CIF de la empresa emisora de la factura que quiere rectificar.
              full_invoice_number:
                type: string
                description: |
                  Serie+Nº Factura que identifica a la factura que se quiere rectificar.
                  Ejemplo: `2026-00001`.
              issue_date:
                type: string
                format: date
                description: |
                  Fecha de expedición de la factura que se quiere rectificar en formato `yyyy-mm-dd`.
                  Ejemplo: `2026-02-26`.
                example: "2026-02-26"

        coupon_key:
          $ref: "#/components/schemas/coupon_key"

        invoicing_agreement_registration_number:
          type: string
          description: |
            Número de registro obtenido al enviar la autorización en materia de facturación o de libros registro a que se refiere la disposición adicional primera del Real Decreto que aprueba el Reglamento.

        sif_agreement_id:
          type: string
          description: |
            Identificación del acuerdo (resolución) a que se refiere el artículo 5 del Reglamento.

      required:
        - sif_id
