openapi: 3.0.0
info:
  title: Kubifactu API
  description: API para el procesamiento y gestión de facturas de Veri*Factu
  version: 1.0.0
  contact:
    email: soporte@kubifactu.com
    name: Soporte KubiFACTU
    url: https://apidocs.kubifactu.com

servers:
  - url: https://api.kubifactu.com
    description: Servidor de producción
  - url: https://devapi.kubifactu.com
    description: Servidor de pruebas

paths:
  /api/invoices:
    get:
      summary: "Listar registros de facturación con filtros"
      description: |
        Obtiene un listado **paginado** de registros de facturación pertenecientes a la empresa autenticada. Cada elemento incluye una **versión reducida** de la información que se obtiene en consultas individuales o cuando se crean nuevos registros de facturación, con los totales almacenados y el desglose fiscal completo.

        Además se devuelve una sección `meta` para la gestión de la paginación.

        El valor devuelto en `meta.next_page_cursor` sirve para solicitar la siguiente página y `meta.prev_page_cursor` para retroceder. Si `meta.has_more` es `false`, no hay más elementos.
      operationId: "listInvoices"
      parameters:
        - name: date_from
          in: query
          required: true
          description: Fecha de inicio del rango de creación de las facturas (incluida). Formato `YYYY-MM-DD`.
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: date_to
          in: query
          required: true
          description: Fecha de fin del rango de creación de las facturas (incluida). Debe ser igual o posterior a `date_from`.
          schema:
            type: string
            format: date
            example: "2026-01-31"
        - name: sif_id
          in: query
          required: false
          description: ID del SIF emisor sobre el que se quieren buscar registros de facturación.
          schema:
            type: string
            example: "A3DEAECE-8698-4E3D-A0A3-A17B523B9703"
        - name: vf_post_status
          in: query
          required: false
          description: |
            Filtrar registros de facturación por el estado de envío a Veri*Factu.

            Ver valores posibles para `vf_post_status` en la [respuesta de envío de registros de facturación](/openapi-reference/enviar-registro-de-facturación#response-data-vf-post-status).
          schema:
            type: string
            example: "failure"
        - name: vf_record_registration_status
          in: query
          required: false
          description: |
            Filtrar registros de facturación por el estado del registro reportado por Veri*Factu.

            Ver valores posibles para `vf_record_registration_status` en la [respuesta de envío de registros de facturación](/openapi-reference/enviar-registro-de-facturación#response-data-vf-record-registration-status).

            **Nota:** Este parámetro se ignora si `with_problems` está presente y es `1`.
          schema:
            type: string
            example: "accepted_with_errors"
        - name: with_problems
          in: query
          required: false
          description: |
            Filtrar registros de facturación con problemas de registro. Cuando este parámetro es `1`, se devuelven únicamente los registros cuyo `vf_record_registration_status` no es correcto o anulado.

            Este filtro es útil para obtener facturas que requieren atención: `failed` (Incorrecto), `accepted_with_errors` (Aceptado con Errores), `not_registered` (No Registrado) y `unknown` (Desconocido).

            **Este parámetro tiene prioridad sobre `vf_record_registration_status`**: si `with_problems=1`, el valor de `vf_record_registration_status` será ignorado.
          schema:
            type: boolean
            example: 1
        - name: per_page
          in: query
          required: false
          description: Número de elementos por página (máximo 50). Valor por defecto 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            example: 25
        - name: cursor
          in: query
          required: false
          description: Cursor para la paginación basada en cursor. Use el valor devuelto en `meta.next_page_cursor`.
          schema:
            type: string
            example: "eyJpZCI6IjE5NzctMDQtMjJUMDY6MDA6MDBaIn0"
      responses:
        '200':
          description: "Listado paginado de registros de facturación."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInvoicesResponse'
        '422':
          description: "Errores de validación."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []
    post:
      summary: "Enviar registro de facturación"
      description: |
        Generación y envío síncrono de un nuevo registro de facturación.

        Antes de crear el registro, la API comprueba la cadena de la misma empresa cliente y el mismo SIF. Si existe un registro anterior pendiente de envío o de resolver su resultado, devuelve HTTP `409` con el código `E-INVOICE-SUBMISSION-BLOCKED`. El nuevo registro no se crea, no se envía a AEAT y no queda en cola.
      operationId: "createInvoiceRecord"
      x-mint:
        content: |
          <Info>
          `lines` continúa admitiéndose como alias de retrocompatibilidad, sin una fecha de retirada prevista. Las nuevas integraciones deben utilizar `tax_breakdown`. No envíes ambas propiedades en una misma factura, ya que la petición será rechazada y el error de validación se devolverá en las dos claves. En los lotes, cada factura puede utilizar individualmente la propiedad canónica o el alias. En los endpoints KubiBAI, ambas propiedades se incluyen dentro de `invoice_data`.
          </Info>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRecordRequest"
      responses:
        '200':
          description: "Factura enviada con éxito."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceRecordResponse'
        '409':
          description: |
            Un registro anterior de la misma empresa cliente y el mismo SIF bloquea la cadena. Consulta o recupera el registro identificado por `blocking_invoice_id` mediante los endpoints existentes y vuelve a solicitar el nuevo registro cuando deje de bloquear la cadena. Un rechazo explícito definitivo de AEAT no bloquea por sí solo nuevos registros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSubmissionBlockedErrorResponse'
              example:
                data:
                  error:
                    code: E-INVOICE-SUBMISSION-BLOCKED
                    message: "Invoice submission is blocked by record 9db6bb78-6799-4abb-b9a0-22d127c543ed (unresolved_submission)."
                    errors:
                      reason: unresolved_submission
                      blocking_invoice_id: "9db6bb78-6799-4abb-b9a0-22d127c543ed"
                    details: null
        '422':
          description: |
            Errores de validación.

            Una subsanación con `correction_key = S` y `previous_rejection_key = X` devuelve el error en `previous_rejection_key` si en KubiFACTU ya existe el alta de la misma factura registrada en la AEAT o pendiente de envío. Consulta en la descripción del campo `previous_rejection_key` qué valor corresponde en cada caso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                registered_original:
                  summary: "Alta original registrada en la AEAT"
                  value:
                    data:
                      error:
                        message: "The given data was invalid."
                        errors:
                          previous_rejection_key:
                            - "AEAT already holds this invoice, so previous_rejection_key cannot be X. To correct the registered record, send the correction with previous_rejection_key N. Existing invoice ID: [9db6bb78-6799-4abb-b9a0-22d127c543ed]."
                        details:
                          request_id: "9ded9e2c-d59e-4432-a926-652cbcfac365"
                pending_original:
                  summary: "Alta original pendiente de envío"
                  value:
                    data:
                      error:
                        message: "The given data was invalid."
                        errors:
                          previous_rejection_key:
                            - "The original record of this invoice is still pending submission to AEAT, so it cannot be corrected with previous_rejection_key X yet. Wait for its submission result. Existing invoice ID: [9db6bb78-6799-4abb-b9a0-22d127c543ed]."
                        details:
                          request_id: "9ded9e2c-d59e-4432-a926-652cbcfac365"
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

  /api/invoices/deferred:
    post:
      summary: "Enviar registro de facturación diferido"
      description: "Generación de un nuevo registro de facturación diferido."
      operationId: "createDeferredInvoiceRecord"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRecordRequest"
      responses:
        '200':
          description: "Factura recibida con éxito."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceRecordResponse'
        '422':
          description: |
            Errores de validación.

            Una subsanación con `correction_key = S` y `previous_rejection_key = X` devuelve el error en `previous_rejection_key` si en KubiFACTU ya existe el alta de la misma factura registrada en la AEAT o pendiente de envío. Consulta en la descripción del campo `previous_rejection_key` qué valor corresponde en cada caso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                registered_original:
                  summary: "Alta original registrada en la AEAT"
                  value:
                    data:
                      error:
                        message: "The given data was invalid."
                        errors:
                          previous_rejection_key:
                            - "AEAT already holds this invoice, so previous_rejection_key cannot be X. To correct the registered record, send the correction with previous_rejection_key N. Existing invoice ID: [9db6bb78-6799-4abb-b9a0-22d127c543ed]."
                        details:
                          request_id: "9ded9e2c-d59e-4432-a926-652cbcfac365"
                pending_original:
                  summary: "Alta original pendiente de envío"
                  value:
                    data:
                      error:
                        message: "The given data was invalid."
                        errors:
                          previous_rejection_key:
                            - "The original record of this invoice is still pending submission to AEAT, so it cannot be corrected with previous_rejection_key X yet. Wait for its submission result. Existing invoice ID: [9db6bb78-6799-4abb-b9a0-22d127c543ed]."
                        details:
                          request_id: "9ded9e2c-d59e-4432-a926-652cbcfac365"
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

  /api/invoices/batch:
    post:
      summary: "Enviar registros de facturación en lote"
      description: |
        Registra entre 1 y 500 registros de facturación que **serán procesados en diferido**.

        La respuesta confirma la recepción del lote, pero no incluye los identificadores ni el resultado individual de los registros. Tampoco confirma su aceptación por Veri*Factu. El resultado de cada registro se obtiene posteriormente mediante la URL indicada en su campo `callback_url` o consultando el registro de facturación.

        Si algún registro no supera la validación, la respuesta contiene los errores indexados según su posición en el array, por ejemplo, `invoices.0.sif_id`.

        ### Resultado mediante callback

        El campo `callback_url` se configura individualmente en cada elemento de `invoices`. Cuando los registros han sido procesados, KubiFACTU agrupa los resultados de una misma empresa cliente y URL de callback, y realiza una petición `POST` con contenido `application/json`.

        El cuerpo del callback siempre es un array y puede contener uno o varios registros. Un callback no tiene por qué corresponder exactamente con el lote original, por lo que la integración debe correlacionar cada resultado mediante `id` o `client_invoice_id`, sin depender de su posición en el array.

        ```json
        [
          {
            "id": "7d76c4a6-6603-4fc6-946a-8b9ffcc93480",
            "client_invoice_id": "FACTURA-2026-0042",
            "record_type": "creation",
            "sif_id": "0995c42c-6708-44fb-bfbf-b363a5fe873e",
            "sender_company_name": "Ferretería Ejemplo, S.L.",
            "sender_tax_id_number": "B12345678",
            "fiscal_year": 2026,
            "full_invoice_number": "F-2026-0042",
            "fingerprint": "8f3d7aa5530f5f6c3a96a5c8a9516a7fd9ce90b9bf3b60375682d8b45ca72867",
            "csv": "CSV-DE-EJEMPLO",
            "vf_post_status": "success",
            "vf_record_registration_status": "success",
            "has_warnings": false,
            "vf_error_descriptions": null,
            "vf_response_body": "PHhtbD5SZXNwdWVzdGEgZGUgZWplbXBsbzwveG1sPg==",
            "qr_value": "https://www2.agenciatributaria.gob.es/wlpl/TIKE-CONT/ValidarQR?nif=B12345678&numserie=F-2026-0042&fecha=01-09-2026&importe=121.00",
            "qr_image_url": "https://api.kubifactu.com/api/invoices/7d76c4a6-6603-4fc6-946a-8b9ffcc93480/qr-image",
            "xml_url": "https://api.kubifactu.com/api/invoices/7d76c4a6-6603-4fc6-946a-8b9ffcc93480/xml"
          }
        ]
        ```

        El contrato completo de cada elemento se detalla en el campo `callback_url` de la petición. Este callback es independiente de la respuesta HTTP inmediata del endpoint.
      operationId: "createBatchOfInvoiceRecords"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchOfInvoicesRecordsRequest"
      responses:
        '200':
          description: "Lote recibido para su procesamiento diferido."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchOfInvoiceRecordsResponse'
        '422':
          description: |
            Errores de validación.

            Una subsanación con `correction_key = S` y `previous_rejection_key = X` devuelve el error en `invoices.<n>.previous_rejection_key` si en KubiFACTU ya existe el alta de la misma factura registrada en la AEAT o pendiente de envío. Consulta en la descripción del campo `previous_rejection_key` qué valor corresponde en cada caso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                registered_original:
                  summary: "Alta original registrada en la AEAT"
                  value:
                    data:
                      error:
                        message: "The given data was invalid."
                        errors:
                          invoices.0.previous_rejection_key:
                            - "AEAT already holds this invoice, so previous_rejection_key cannot be X. To correct the registered record, send the correction with previous_rejection_key N. Existing invoice ID: [9db6bb78-6799-4abb-b9a0-22d127c543ed]."
                        details:
                          request_id: "9ded9e2c-d59e-4432-a926-652cbcfac365"
                pending_original:
                  summary: "Alta original pendiente de envío"
                  value:
                    data:
                      error:
                        message: "The given data was invalid."
                        errors:
                          invoices.0.previous_rejection_key:
                            - "The original record of this invoice is still pending submission to AEAT, so it cannot be corrected with previous_rejection_key X yet. Wait for its submission result. Existing invoice ID: [9db6bb78-6799-4abb-b9a0-22d127c543ed]."
                        details:
                          request_id: "9ded9e2c-d59e-4432-a926-652cbcfac365"
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

  /api/invoices/{invoiceId}:
    get:
      summary: Obtener registro de facturación
      description: |
        Obtener información sobre un registro de facturación.
        > Este endpoint **no hace consulta a Veri*Factu**; los datos se devuelven directamente desde nuestra base de datos.
      operationId: "getInvoiceRecord"
      parameters:
        - name: invoiceId
          in: path
          description: |
            ID de la factura. Este ID se obtiene en la respuesta a las altas de registros de facturación o puede usarse el identificador único de la factura **dentro del sistema del cliente** si en la creación del registro de facturación se hizo uso del campo `client_invoice_id`. El ID también se puede obtener desde el panel web, accediendo a la factura en el campo **ID DE KUBIFACTU**.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Datos de la factura."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceRecordResponse'
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

  /api/invoices/{invoiceId}/xml:
    get:
      summary: Descargar XML del registro de facturación
      description: |
        Descarga el XML del registro de facturación indicado por el campo `xml_url` de las respuestas de factura y callbacks.

        La petición debe hacerse con el header HTTP `X-Qbikode-ClientApiKey`.
      operationId: "downloadInvoiceRecordXml"
      parameters:
        - name: invoiceId
          in: path
          description: |
            ID de la factura en KubiFACTU o identificador único de la factura dentro del sistema del cliente (`client_invoice_id`) si se informó al crear el registro de facturación.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: XML del registro de facturación.
          content:
            application/xml:
              schema:
                type: string
                format: binary
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '404':
          description: "No encontrado. La factura no existe para la empresa autenticada o el XML aún no está disponible."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

  /api/invoices/{invoiceId}/qr-image:
    get:
      summary: Descargar imagen QR del registro de facturación
      description: |
        Descarga la imagen PNG del código QR indicada por el campo `qr_image_url` de las respuestas de factura y callbacks.

        La petición debe hacerse con el header HTTP `X-Qbikode-ClientApiKey`.
      operationId: "downloadInvoiceRecordQrImage"
      parameters:
        - name: invoiceId
          in: path
          description: |
            ID de la factura en KubiFACTU o identificador único de la factura dentro del sistema del cliente (`client_invoice_id`) si se informó al crear el registro de facturación.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Imagen PNG del código QR.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '404':
          description: "No encontrado. La factura no existe para la empresa autenticada o el estado del registro no permite mostrar QR."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

  /api/invoices/{invoiceId}/query:
    get:
      summary: Consultar registro de facturación con Veri*Factu
      description: |
        Obtiene el estado de un registro de facturación haciendo previamente una consulta a Veri*Factu. Se llama a la URL de callback del registro si se incluyó en el momento de su alta. [Ver formato de la llamada de callback](enviar-registro-de-facturación#body-callback-url).

        La consulta sólo actualiza el registro solicitado cuando el resultado permite confirmar su identidad y huella, o confirma que no está registrado mediante un SinDatos válido. Una consulta fallida o inconcluyente no confirma la aceptación ni permite dar por resuelta una conciliación pendiente. Un rechazo confirmado se conserva como rechazo.

        La AEAT no devuelve el CSV en las consultas, así que una consulta nunca lo informa ni lo recupera. Si confirma un registro cuyo resultado de envío no llegó, el registro queda con su estado actualizado y el campo `csv` vacío. Usa `vf_record_registration_status` para saber si el registro está acreditado. [Leer más en la FAQ](/faq).
      operationId: "queryInvoiceRecord"
      parameters:
        - name: invoiceId
          in: path
          description: |
            ID de la factura. Este ID se obtiene en la respuesta a las altas de registros de facturación o puede usarse el identificador único de la factura **dentro del sistema del cliente** si en la creación del registro de facturación se hizo uso del campo `client_invoice_id`. El ID también se puede obtener desde el panel web, accediendo a la factura en el campo **ID DE KUBIFACTU**.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Datos de la factura tras haber sido actualizada con el estado registrado en Veri*Factu."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceRecordResponse'
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

  /api/invoices/{invoiceId}/resubmit:
    get:
      summary: Reenviar registro de facturación
      description: |
        Reenvía un registro de facturación a Veri*Factu sin volver a generarlo. Este endpoint es útil para registros que fallaron **por un problema técnico de conexión** (timeout, error del servidor o falta de respuesta) en el envío inicial.

        Ante un resultado incierto, consulta el estado del mismo registro antes de decidir reenviarlo. Un timeout identificable se guarda como `vf_post_status = failure` y `vf_record_registration_status = unknown`; por sí solo no activa la conciliación obligatoria.

        La conciliación obligatoria bloquea el reenvío con HTTP 409 y motivo `pending_reconciliation` hasta aclarar el resultado: se aplica a la marca interna `recovery_reconciliation_pending` y al caso de envío `success` con registro `unknown`, incluidos registros históricos. Los duplicados 3000/3001 y las respuestas inutilizables o desconocidas pueden exigir conciliación. El UUID de bloqueo puede ser el propio registro; los bloqueos por registros anteriores de la misma empresa cliente y SIF mantienen los motivos `pending_submission` y `unresolved_submission`.

        El flujo de comprobar el estado y confirmar el reenvío en dos clics corresponde al panel, no a este endpoint. La API conserva sus operaciones y autenticación y no impone la comprobación previa del panel para `failure` + `unknown` sin conciliación pendiente; los envíos iniciales directos mantienen la consulta inmediata cuando un timeout deja el estado en `unknown`. Los reintentos automáticos siguen respetando las esperas y el orden de la cadena. [Leer más en la FAQ](/faq).

        Si el registro ya tiene un CSV guardado, el reenvío no lo borra cuando la nueva respuesta de la AEAT no incluye uno (por ejemplo, ante un registro duplicado) ni cuando el envío falla sin respuesta. Un CSV nuevo sí sustituye al anterior.

        Se llama a la URL de callback del registro si se incluyó en el momento de su alta.
      operationId: "resubmitInvoiceRecord"
      parameters:
        - name: invoiceId
          in: path
          description: |
            ID de la factura. Este ID se obtiene en la respuesta a las altas de registros de facturación o puede usarse el identificador único de la factura **dentro del sistema del cliente** si en la creación del registro de facturación se hizo uso del campo `client_invoice_id`. El ID también se puede obtener desde el panel web, accediendo a la factura en el campo **ID DE KUBIFACTU**.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Registro de facturación reenviado con éxito."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvoiceRecordResponse'
        '409':
          description: |
            Reenvío bloqueado por conciliación pendiente del propio registro o por un registro anterior de la misma empresa cliente y SIF. No se reenvía el registro. Consulta el UUID indicado y resuelve el bloqueo antes de volver a solicitar el reenvío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSubmissionBlockedErrorResponse'
              examples:
                pendingReconciliation:
                  summary: El propio registro está pendiente de conciliación
                  value:
                    data:
                      error:
                        code: E-INVOICE-SUBMISSION-BLOCKED
                        message: "El resultado de este envío está pendiente de confirmación. Consulta su estado en Veri*Factu antes de reenviarlo."
                        errors:
                          reason: pending_reconciliation
                          blocking_invoice_id: "9db6bb78-6799-4abb-b9a0-22d127c543ed"
                        details: null
        '404':
          description: "No encontrado. El registro de facturación con el ID indicado no existe."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '422':
          description: |
            Errores de validación. Posibles causas:
            - El registro no tiene huella generada (no se ha procesado correctamente).
            - El registro ya está registrado en Veri*Factu y no puede ser reenviado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: |
            Error interno del servidor. Posibles causas:
            - Error de conexión con Veri*Factu.
            - Error al parsear la respuesta XML de Veri*Factu.
            - Error al generar el XML para Veri*Factu.
      security:
        - client_api_key: []

  /api/invoices/{invoiceId}/cancel:
    post:
      summary: "Anular registro de facturación"
      description: |
        Anulación de un registro de facturación.

        Si se considera que "toda la factura" en sí misma está mal o no debería haberse emitido, siempre que para solucionarlo no deba emplearse algún procedimiento (de rectificativa u otro) previsto en el Reglamento de Obligaciones de Facturación (ROF), se podrá anular, generando para ello un registro de facturación de anulación.
      operationId: "cancelInvoiceRecord"
      parameters:
        - name: invoiceId
          in: path
          description: |
            ID de la factura. Este ID se obtiene en la respuesta a las altas de registros de facturación. También se puede obtener desde el panel web, accediendo a la factura en el campo **ID DE KUBIFACTU**.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Factura enviada con éxito."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelInvoiceRecordResponse'
        '422':
          description: "Errores de validación."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

  /api/invoices/{invoiceId}/deferredcancel:
    post:
      summary: "Anular registro de facturación en diferido"
      description: "Anulación de un registro de facturación en diferido."
      operationId: "cancelInvoiceRecordDeferred"
      parameters:
        - name: invoiceId
          in: path
          description: |
            ID de la factura. Este ID se obtiene en la respuesta a las altas de registros de facturación. También se puede obtener desde el panel web, accediendo a la factura en el campo **ID DE KUBIFACTU**.
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                callback_url:
                  type: string
                  format: url
                  description: |
                    Sólo aplicable a [registros de facturación en diferido](/basic-concepts#registros-de-facturación-diferidos) o reenvíos de regitros de facturación. URL a la que se llamará con el resultado de la AEAT al procesamiento del registro de facturación.

                    Se hará una petición POST a esta URL y se enviarán los siguientes campos en formato JSON:

                    - `id`: `string`. Identificador de KubiFACTU para el registro de facturación.
                    - `client_invoice_id`: `string`. Identificador del cliente para el registro de facturación.
                    - `record_type`: `string (creation|cancellation)`. Tipo de registro de facturación.
                    - `sif_id`: `string`. ID del SIF utilizado para la creación del registro.
                    - `sender_company_name`: `string`. Nombre de la empresa emisora.
                    - `sender_tax_id_number`: `string`. CIF/NIF de la empresa emisora.
                    - `full_invoice_number`: `string`. Número de factura.
                    - `fingerprint`: `string`. Huella del registro de facturación.
                    - `csv`: `string|null`. Código Seguro de Verificación (CSV) de la remisión que contiene el registro. Puede ser `null` aunque el registro esté aceptado: para saber si está acreditado, usa `vf_record_registration_status`, no la presencia del `csv`. [Leer más en la FAQ](/faq).
                    - `vf_post_status`: `string`. Ver valores posibles en la documentación del campo `vf_post_status` de la respuesta de envío de registros de facturación.
                    - `vf_record_registration_status`: `string`. Ver valores posibles en la documentación del campo `vf_record_registration_status` de la respuesta de envío de registros de facturación.
                    - `has_warnings`: `bool`. Indica si el registro contiene errores que deban ser subsanados.
                    - `vf_error_descriptions`: `string|null`. Cadena con la descripción de los errores devueltos por Veri*Factu.
                    - `vf_response_body`: `string|null`. Cuerpo de la respuesta de Veri*Factu en formato Base64. Contiene el XML completo devuelto por la AEAT tras el envío del registro de facturación.
                    - `xml_url`: `string|null`. URL para descargar el XML del registro de facturación enviado a Veri*Factu mediante el endpoint [Descargar XML del registro de facturación](/openapi-reference/descargar-xml-del-registro-de-facturación). Será `null` si el XML aún no está disponible.
                    - `qr_value`: `string|null`. URL del código QR para validación de la factura en Veri*Factu. Será `null` si el registro fue rechazado o no aplica mostrar QR.
                    - `qr_image_url`: `string|null`. URL para descargar la imagen PNG del código QR generado por KubiFACTU mediante el endpoint [Descargar imagen QR del registro de facturación](/openapi-reference/descargar-imagen-qr-del-registro-de-facturación). Será `null` si el registro fue rechazado o no aplica mostrar QR.
                  example: "https://www.tuempresa.com/kubifactu/callback"
      responses:
        '200':
          description: "Factura enviada con éxito."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelInvoiceRecordResponse'
        '422':
          description: "Errores de validación."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: "No autorizado. La API-KEY proporcionada no es válida."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedApiKeyErrorResponse'
        '500':
          description: "Error interno del servidor."
      security:
        - client_api_key: []

