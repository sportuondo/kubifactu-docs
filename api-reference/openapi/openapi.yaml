            id:
              type: string
              format: uuid
              description: Identificador único de la empresa creada.
              example: "9dcccd85-496d-4ed8-8f78-edfacac68964"
            company_name:
              type: string
              description: Nombre de la empresa.
              example: "Empresa de ejemplo"
            tax_id_number:
